<!DOCTYPE html>
<html>
<head>
    <title>Fractal Gallery</title>
    <style>
        body { background: #0a0a0a; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
        .card { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 12px; transition: 0.3s; }
        .card:hover { border-color: #00ffcc; transform: scale(1.05); }
        img { width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .title { font-size: 0.9em; color: #888; text-transform: uppercase; }
        a { color: #ffcc00; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>ARCHIVED FRACTALS</h1>
    <a href="/">← RETURN TO LIVE FEED</a>
    <div class="grid">
        {% for img in images %}
        <div class="card">
            <img src="/gallery-images/{{ img }}">
            <div class="title">{{ img.replace('.png', '') }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
